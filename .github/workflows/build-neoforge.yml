name: Build NeoForge mod 26.3

on:
  push:
    paths:
      - 'urban_skate_project_v0.6.0.zip'
      - '.github/workflows/build-neoforge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Inspect and extract mod project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q urban_skate_project_v0.6.0.zip -d project
          echo "Archive contents:"
          find project -maxdepth 4 -type f | sort | head -300
          BUILD_FILE="$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No build.gradle or build.gradle.kts found in the archive."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Gradle project: $PROJECT_DIR"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" clean build --no-daemon --stacktrace

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: urban-skate-0.6.0-neoforge-26.3
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
